name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        run: |
          curl -sSfL https://download.swift.org/swift-6.0.3-release/ubuntu2204/swift-6.0.3-RELEASE/swift-6.0.3-RELEASE-ubuntu22.04.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/swift-6.0.3-RELEASE-ubuntu22.04/usr/bin" >> "$GITHUB_PATH"
      - name: Core tests (Swift 6 strict, golden values from the Kodi addon)
        run: scripts/core-tests/run.sh

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project TorBoxLibraryManager.xcodeproj \
            -scheme TorBoxLibraryManager \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
      - name: Report compiler errors
        if: failure()
        run: |
          # Surface errors as annotations so they show on the run page and via the API.
          grep -E '^/.*: error: ' build.log | sort -u | head -50 | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1 | sed "s|$GITHUB_WORKSPACE/||")
            row=$(echo "$line" | cut -d: -f2)
            message=$(echo "$line" | cut -d: -f4- | sed 's/^ error: //')
            echo "::error file=$file,line=$row::$message"
          done
